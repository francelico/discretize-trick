[project]
name = "discretize-trick"
version = "0.1.0"
description = "Minimal voxel VAE and voxel diffusion training sandbox"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    "accelerate==1.9.0",
    "easydict==1.13",
    "einops==0.8.1",
    "imageio==2.37.0",
    "imageio-ffmpeg==0.6.0",
    "loguru==0.7.3",
    "numpy==1.26.4",
    "pandas==3.0.5",
    "pysdl2==0.9.17",
    "safetensors==0.8.0",
    "scipy==1.17.1",
    "tqdm==4.66.3",
    "tyro==1.0.15",
    "utils3d",
    "vispy==0.15.2",
    "wandb==0.25.0",
]

[dependency-groups]
cu = [
    "timm==1.0.28",
    "torch==2.7.1",
    "torchvision==0.22.1",
]

[tool.uv]
default-groups = ["cu"]
package = false

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", group = "cu" },
]
torchvision = [
    { index = "pytorch-cu126", group = "cu" },
]
utils3d = { git = "https://github.com/EasternJournalist/utils3d", rev = "c5daf6f6c244d251f252102d09e9b7bcef791a38" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
